name: Keep site awake

# Render's free plan puts the app to sleep after 15 minutes without visitors, and the next visitor waits
# 10-60 seconds while it wakes. A visit every 10 minutes keeps it awake. Delete this file on a paid plan.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://learn.mauforge.com/healthz
