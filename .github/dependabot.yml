version: 2
updates:
  # Python dependencies: requirements.txt and requirements-dev.txt at the repo root.
  # When ruff is bumped, also update `rev` in .pre-commit-config.yaml to match (see CLAUDE.md).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Actions used in .github/workflows/
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
